<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="References — The Báb: Examining His Claims">
    <title>References | The Báb: Examining His Claims</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <style>
        /* Nav logo with image */
        .nav-logo {
            display: flex !important;
            align-items: center;
            gap: 0.55rem;
        }

        .nav-logo-img {
            height: 32px;
            width: auto;
            object-fit: contain;
            border-radius: 6px;
        }

        /* ===== References Page Styles ===== */

        .page-header {
            padding: 8rem 2rem 3.5rem;
            text-align: center;
            background: linear-gradient(135deg, var(--bg-peach) 0%, var(--bg-warm) 50%, var(--bg-cream) 100%);
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%231B7A5A' stroke-width='0.5' opacity='0.08'%3E%3Cpath d='M40 0 L80 40 L40 80 L0 40 Z'/%3E%3Ccircle cx='40' cy='40' r='15'/%3E%3C/g%3E%3C/svg%3E");
        }

        .page-header-content {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 2.8rem);
            color: var(--text-dark);
            margin-bottom: 0.8rem;
        }

        .page-header h1 span {
            color: var(--accent-coral);
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .presenter-badge {
            display: inline-block;
            padding: 0.3rem 1.2rem;
            background: var(--accent-coral);
            color: #fff;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        /* References List */
        .ref-content {
            padding: 3rem 2rem;
            background: var(--bg-cream);
        }

        .ref-inner {
            max-width: 800px;
            margin: 0 auto;
        }

        .ref-list {
            background: var(--bg-card);
            border: 1px solid var(--border-warm);
            border-radius: 14px;
            padding: 2.5rem;
            box-shadow: 0 2px 12px var(--shadow-warm);
            list-style: none;
        }

        .ref-list li {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border-warm);
            color: var(--text-body);
            font-size: 1.02rem;
            line-height: 1.8;
        }

        .ref-list li:last-child {
            border-bottom: none;
        }

        .ref-list li em {
            color: var(--accent-coral);
        }

        .ref-list li a {
            color: var(--accent-coral);
            text-decoration: none;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .ref-list li a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--accent-coral);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 2rem;
            transition: gap var(--transition-base);
        }

        .back-link:hover {
            gap: 0.7rem;
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.5;
        }

        @media (max-width: 768px) {
            .ref-list {
                padding: 1.5rem;
            }

            .ref-list li {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div id="navbar-placeholder"></div>

    <!-- Page Header -->
    <header class="page-header">
        <div class="page-header-content">
            <span class="presenter-badge">Taha's Section</span>
            <h1>Sources & <span>References</span></h1>
            <p>Primary sources and references used in the examination of the Báb's claims.</p>
        </div>
    </header>

    <!-- References Content -->
    <main class="ref-content">
        <div class="ref-inner">

            <ul class="ref-list reveal">
                <li>
                    Abolfazl Golpaygani, <em>Kashf al-Ghitaʾ ʿan Hiyal al-Aʿdaʾ</em>
                </li>
                <li>
                    Erfan.ir — "Examining the Claims of the Báb"
                    <br>
                    <a href="https://erfan.ir/farsi/amp88365.html" target="_blank" rel="noopener">https://erfan.ir/farsi/amp88365.html</a>
                </li>
            </ul>

            <a class="back-link" href="index.html">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
                Back to main page
            </a>
        </div>
    </main>

    <!-- Back to Top Button -->
    <button class="back-to-top" aria-label="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
        </svg>
    </button>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <!-- Load components -->
    <script src="../../js/components.js"></script>

    <script>
        // Reveal animations on scroll
        const reveals = document.querySelectorAll('.reveal');
        function checkReveal() {
            const wh = window.innerHeight;
            reveals.forEach(el => {
                if (el.getBoundingClientRect().top < wh - 120) {
                    el.classList.add('active');
                }
            });
        }
        window.addEventListener('scroll', checkReveal);
        window.addEventListener('load', checkReveal);
    </script>
</body>
</html>
